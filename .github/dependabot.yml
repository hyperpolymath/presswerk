# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  # Rust/Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing. The previous
    # `ignore: "*" patch` rule also silenced security PRs under GitHub\'s
    # current Dependabot behaviour. See rsr-template-repo commit 78b050e
    # and 007-lang/audits/audit-dependabot-automation-gap-2026-04-17.md.
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Elixir/Mix
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Node.js/npm
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Python/pip
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Nix flakes
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
