# This workflow is managed by gh actions-lock.
# Presswerk — Run workspace benchmarks (informational)

name: Benchmarks

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  bench:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Run benchmarks
        run: cargo bench --workspace
